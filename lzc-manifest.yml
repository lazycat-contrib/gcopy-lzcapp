application:
  subdomain: gcopy
  background_task: true
  public_path:
    - /
  injects:
    - id: open-save-chooser
      on: browser
      when:
        - "/*"
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
  upstreams:
    - location: /
      backend: http://gcopy:3375/
services:
  gcopy:
    # upstream: llaoj/gcopy:v2.0.3
    image: registry.lazycat.cloud/czyt/llaoj/gcopy:29069839c32a949c
    environment:
      - GCOPY_APP_KEY={{ stable_secret "appkey$110" }}
      - GCOPY_LISTEN=:3375
      - GCOPY_MAX_CONTENT_LENGTH={{ .U.max_content_length }}
{{if .U.use_token_auth}}
      - GCOPY_AUTH_MODE=token
{{else}}
      - GCOPY_AUTH_MODE=email
      - GCOPY_SMTP_HOST={{ .U.smtp_host }}
      - GCOPY_SMTP_PORT={{ .U.smtp_port }}
      - GCOPY_SMTP_USERNAME={{ .U.smtp_username }}
      - GCOPY_SMTP_PASSWORD={{ .U.smtp_password }}
      - GCOPY_SMTP_SENDER={{ .U.smtp_sender }}
      - GCOPY_SMTP_SSL={{ .U.smtp_ssl }}
{{end}}
